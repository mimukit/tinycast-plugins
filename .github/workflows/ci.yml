name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # On a PR, Turbo runs only the packages that changed since origin/main and
  # the packages that depend on them. A push to main runs every package.
  TURBO_FILTER: ${{ github.event_name == 'pull_request' && '...[origin/main]' || '' }}
  # The Tinycast commit that the smoke job runs against. Change it by hand in a PR.
  TINYCAST_SHA: 21a0b7fd1f02c19a9fbd5cb0b7c162420aa7b1e2

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main for the PR filter
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A missing sqlite3 fails the job here, so the store tests cannot skip.
      - run: sqlite3 --version
      - run: pnpm turbo run typecheck test build ${TURBO_FILTER:+"--filter=$TURBO_FILTER"}
      - run: bash scripts/check-copies.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch origin/main for the PR filter
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out Tinycast at the pinned commit
        run: |
          git init -q "$RUNNER_TEMP/tinycast"
          cd "$RUNNER_TEMP/tinycast"
          git remote add origin https://github.com/abue-ammar/tinycast
          git fetch -q --depth 1 origin "$TINYCAST_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TINYCAST_SHA"
      - run: pnpm turbo run smoke --continue ${TURBO_FILTER:+"--filter=$TURBO_FILTER"}
        env:
          TINYCAST_DIR: ${{ runner.temp }}/tinycast
